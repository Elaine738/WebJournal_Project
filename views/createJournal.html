  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.2/jquery.min.js"></script>
  <script type="text/javascript" src="manageJournal.js"></script>
  

</head>


<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary p-3 mb-2 bg-secondary text-white">
        <div class="container-fluid">
          <a class="navbar-brand">WebJournal</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/login">Create Entry</a>
              </li>
            </ul>
            <ul class = "navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="/register">Register</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/login">Login</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/dashboard">Page view test - journal</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="row align-items-start">
        <div class="col-2"></div>
        <div class="col-8" style="text-align: left; border-bottom: 1px solid #222222;">
          <p>Create New Journal:</p>
          <form style="font-size: 10pt;" id="newJournalForm" > <!--action="/newJournal" method="POST" -->
            <div class="mb-3">
              <label for="title" class="form-label">Name:</label>
              <input type="text" class="form-control" id="title">
            </div>
            <div class="mb-3">
              <label for="UpFile" class="form-label">Cover Image:</label>
              <input type="file" class="form-control" id="UpFile">
            </div>
            <button type="button" id="subNewForm" class="btn btn-primary">Submit</button> <br/><br/>
            <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.2/jquery.min.js">
            $('submit').on('click', function() {
              $.ajax({
                type: 'POST',
                url: '/newJournal',
                data: { File: $("#UpFile")[0].files[0],
                        journalName: $("title".val()),
                        userID: 'someid'
                 },
                success: function(resultData) {
                   alert(resultData);
                }
              });
          });
        </script>
          </form>
        </div>
        <div class="col-2"></div>
      </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
