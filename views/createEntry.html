<!DOCTYPE html>
<html lang="en" ng-app="Dashboard">
  <head>
    <title>Web Journal</title>    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  </head>
  
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand">WebJournal</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="/dashboard">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page"  href="#">Create Entry</a>
              </li>
            </ul>
            <ul class = "navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="/register">Register</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/login">Login</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    <div class="container">

      <!-- New Entry Box -->
      <div class="row align-items-start">
        <div class="col-2"></div>
        <div class="col-8" style="text-align: left; border-bottom: 1px solid #222222;">
          <form style="font-size: 10pt;" id="newAssetForm">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title">
            </div>
            <div class="mb-3">
                <label for="body" class="form-label">Body</label>
                <textarea id="body" class="form-control" name="body" rows="9" cols="50"></textarea>
              </div>
            <div class="mb-3">
              <label for="UpFile" class="form-label">File to Upload</label>
              <input type="file" class="form-control" id="imageInput">
              <img id="previewImage" style="max-width: 200px; max-height: 200px;">
              <script>
                //https://www.tutorialspoint.com/preview-an-image-before-it-is-uploaded-in-javascript#:~:text=To%20enable%20image%20preview%20before,the%20file%20input's%20value%20change.
                const imageInput = document.getElementById('imageInput');
                const previewImage = document.getElementById('previewImage');
                function previewSelectedImage() {
                   const file = imageInput.files[0];
                   if (file) {
                      const reader = new FileReader();
                      reader.readAsDataURL(file);
                      reader.onload = function(e) {
                         previewImage.src = e.target.result;
                      }
                   }
                }
                imageInput.addEventListener('change', previewSelectedImage);
             </script>
            </div>
            <button type="button" id="subNewForm" class="btn btn-primary">Create Entry</button> <br/><br/>
            <input type="reset" value="Reset">
          </form>
        </div>
        <div class="col-2"></div>
      </div>

      <!-- View Post Area -->
      <div class="row align-items-start">
        <div class="col-2"></div>
        <div class="col-8" style="text-align: left;">
          <div style="padding: 5px;">
            <button id="getEntries" type="button" class="btn btn-primary">View Posts</button>
          </div>
          <div id="ImagesList">
            <h4>Please click the view posts button if you wish to view the posts currently on the system.</h4>
          </div>
        </div>
        <div class="col-2"></div>
      </div>
      <div id="EditPost" style="display: none;">
        <form id="editPostForm">
          <h4>Edit Post</h4>
          <div class="mb-3">
            <label for="editTitle" class="form-label">Title</label>
            <input type="text" class="form-control" id="editTitle">
          </div>
          <div class="mb-3">
            <label for="editCaption" class="form-label">Caption</label>
            <input type="text" class="form-control" id="editCaption">
          </div>
          <div class="mb-3">
            <label for="editTags" class="form-label">Tags</label>
            <input type="text" class="form-control" id="editTags">
          </div>
          <button type="button" id="saveEdit" class="btn btn-success">Save Changes</button>
          <button type="button" id="cancelEdit" class="btn btn-secondary">Cancel</button>
        </form>
      </div>
      

    </div>


  </body>
</html>
